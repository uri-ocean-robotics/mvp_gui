<script src="{{ url_for('static', filename='js/plotly-latest.min.js') }}"></script>

<div id="heading_plot" style="width:300px;height:300px;"></div>

<script>
    let intervalId_heading = null;
    const updateInterval_heading = 1000
    const plotSettings = initializePlot();

    // Function to start the interval
    function startInterval() {
        if (intervalId_heading === null) {
            intervalId_heading = setInterval(() => updatePlot(plotSettings), updateInterval_heading);
        }
    }

    // Function to stop the interval
    function stopInterval() {
        if (intervalId_heading !== null) {
            clearInterval(intervalId_heading);
            intervalId_heading = null;
        }
    }

    // Event listener for page visibility change
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            startInterval();
        } else {
            stopInterval();
        }
    });

    // Initial check to start the interval if the page is already visible
    if (document.visibilityState === 'visible') {
        startInterval();
    }

    // Initial setup for the plot
    function initializePlot() { 
        const layout = {
            title: 'Heading',
            polar: {
                angularaxis: {
                    tickmode: "linear",
                    dtick: 30,  // 30-degree interval
                    range: [0, 360],
                    rotation: 90,
                    direction: "clockwise",
                    tickfont: { size: 10 }
                },
                radialaxis: {
                    visible: false,
                    range: [0, 1]
                }
            },
            showlegend: false,
            margin: { t: 50, b: 20, l: 50, r: 50 },
            annotations: [
                {
                    x: 0.5,
                    y: 1.1,
                    xref: 'paper',
                    yref: 'paper',
                    text: 'N',
                    showarrow: false,
                    font: { size: 14, color: 'black' },
                    xanchor: 'center'
                },
                {
                    x: 1.25,
                    y: 0.5,
                    xref: 'paper',
                    yref: 'paper',
                    text: 'E',
                    showarrow: false,
                    font: { size: 14, color: 'black' },
                    yanchor: 'middle'
                },
                {
                    x: 0.5,
                    y: -0.1,
                    xref: 'paper',
                    yref: 'paper',
                    text: 'S',
                    showarrow: false,
                    font: { size: 14, color: 'black' },
                    xanchor: 'center'
                },
                {
                    x: -0.25,
                    y: 0.5,
                    xref: 'paper',
                    yref: 'paper',
                    text: 'W',
                    showarrow: false,
                    font: { size: 14, color: 'black' },
                    yanchor: 'middle'
                }
            ]
        };

        const config = {
            staticPlot: true,  // Disable all interactivity
            displayModeBar: false,  // Hide the mode bar
            scrollZoom: false,  // Disable scroll zoom
            doubleClick: false,  // Disable double-click interactions
        };

        Plotly.newPlot('heading_plot', [], layout, config);
        
        // Return layout and config
        return { layout, config };
    }

    function updatePlot(layout){
        fetch('/path/to/api/endpoint')
            .then(response => response.json())
            .then(data => {
                const roll = data.orientation_data.roll
                const pitch = data.orientation_data.pitch
                const yaw = data.orientation_data.yaw

                const roll_setpoint = data.orientation_setpoint.roll
                const pitch_setpoint = data.orientation_setpoint.pitch
                const yaw_setpoint = data.orientation_setpoint.yaw

                const layout = plotSettings.layout
                const config = plotSettings.config
   
                const trace_yaw = {
                    type: "scatterpolar",
                    r: [0, 1],
                    theta: [yaw, yaw],
                    mode: 'lines+markers',
                    marker: { size: 8, color: 'blue' },
                    line: { color: 'blue', width: 3 }
                };

                const trace_yaw_setpoint = {
                    type: "scatterpolar",
                    r: [0, 1],
                    theta: [yaw_setpoint, yaw_setpoint],
                    mode: 'lines+markers',
                    marker: { size: 8, color: 'red' },
                    line: { color: 'red', width: 3 }
                };

                // Update the plot with the new arrow
                Plotly.react('heading_plot', [trace_yaw, trace_yaw_setpoint], layout, config);
            })
    }
    

</script>
